version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ess-postgres
    environment:
      POSTGRES_DB: ess_salary_advance
      POSTGRES_USER: ess_user
      POSTGRES_PASSWORD: ess_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ess_user -d ess_salary_advance"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-service:
    build:
      context: ./backend-service
    container_name: ess-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ess_salary_advance
      SPRING_DATASOURCE_USERNAME: ess_user
      SPRING_DATASOURCE_PASSWORD: ess_password
      APP_JWT_SECRET: change-me-super-secure-jwt-secret-key-with-at-least-256-bits
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend-service:
    build:
      context: ./frontend-service
    container_name: ess-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend-service

volumes:
  postgres_data:
