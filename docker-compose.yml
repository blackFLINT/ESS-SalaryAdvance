version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME:-ess-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-service:
    build:
      context: ./backend-service
    container_name: ${BACKEND_CONTAINER_NAME:-ess-backend}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-test_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change me}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-Password@123}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend-service:
    build:
      context: ./frontend-service
    container_name: ${FRONTEND_CONTAINER_NAME:-ess-frontend}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend-service

volumes:
  postgres_data:
