server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/db}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-super-secure-jwt-secret-key-with-at-least-256-bits}
    expiration-ms: 3600000
  seed:
    password: ${APP_SEED_PASSWORD:passwd}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    "[org.springframework.security]": INFO
    "[com.ess.salaryadvance]": DEBUG
    "[org.hibernate.SQL]": DEBUG
